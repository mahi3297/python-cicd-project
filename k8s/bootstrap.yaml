# ─────────────────────────────────────────────────────────────────────────────
# Kubernetes Bootstrap Manifests
# Apply once: kubectl apply -f k8s/bootstrap.yaml
# ─────────────────────────────────────────────────────────────────────────────

# ── Namespaces ────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: Namespace
metadata:
  name: dev
  labels:
    env: dev
    managed-by: argocd
---
apiVersion: v1
kind: Namespace
metadata:
  name: staging
  labels:
    env: staging
    managed-by: argocd
---
apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    env: production
    managed-by: argocd

# ── ResourceQuotas — prevent any one namespace hogging the cluster ────────────
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dev-quota
  namespace: dev
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-quota
  namespace: staging
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "30"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: production-quota
  namespace: production
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 16Gi
    limits.cpu: "32"
    limits.memory: 32Gi
    pods: "100"

# ── Network Policies — isolate namespaces ─────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: production
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-controller
  namespace: production
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: python-cicd-app
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 5000
          protocol: TCP
  policyTypes:
    - Ingress

